<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Motto Appraisal Service</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="stylesheet" href="/styles.css?v=404">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-6);
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 700;
      color: var(--electric-blue);
      line-height: 1;
      margin-bottom: var(--space-4);
    }
    .error-message {
      font-size: var(--text-lg);
      color: var(--blue-grey);
      max-width: 480px;
      margin-bottom: var(--space-6);
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-code">404</div>
    <h1 style="font-size: var(--text-xl); color: var(--ivory); margin-bottom: var(--space-3);">Page Not Found</h1>
    <p class="error-message">The page you're looking for doesn't exist. It may have been moved or the URL might be incorrect.</p>
    <a href="/" class="btn btn--primary" style="text-decoration: none; padding: var(--space-3) var(--space-5); border-radius: 8px;">Back to Home</a>
  </div>
</body>
</html>
